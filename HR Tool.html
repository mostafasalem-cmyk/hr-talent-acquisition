<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HR Talent Acquisition Tool</title>

<style>
/* ================= THEME ================= */
:root{
  --bg:#f8fafc;
  --card:#ffffff;
  --text:#1e293b;
  --muted:#64748b;
  --sidebar1:#1e293b;
  --sidebar2:#0f172a;
  --accent:#0f172a;
  --danger:#ef4444;
  --shadow:0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
  --input-bg:#ffffff;
  --input-border:#e2e8f0;
  --search-mark-bg:#fde047;
  --focus-bg:#eff6ff;
  --focus-border:#3b82f6;
  --focus-text:#1d4ed8;
}

body.dark{
  --bg:#0f172a;
  --card:#1e293b;
  --text:#f1f5f9;
  --muted:#94a3b8;
  --sidebar1:#020617;
  --sidebar2:#0f172a;
  --accent:#38bdf8;
  --shadow:0 10px 15px -3px rgb(0 0 0 / 0.5);
  --input-bg:#334155;
  --input-border:#475569;
  --search-mark-bg:#854d0e;
  --focus-bg:#1e3a8a44;
  --focus-border:#3b82f6;
  --focus-text:#93c5fd;
}

/* ================= BASE ================= */
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  display:flex;
  height:100vh;
  background:var(--bg);
  color:var(--text);
  transition:.3s ease;
  overflow:hidden;
}

/* ================= SIDEBAR ================= */
.sidebar{
  width:260px;
  background:linear-gradient(180deg,var(--sidebar1),var(--sidebar2));
  color:#fff;
  padding:20px;
  overflow-y:auto;
  flex-shrink:0;
  display:flex;
  flex-direction:column;
}
.sidebar h2{
  margin:0 0 24px;
  font-size:1.2rem;
  font-weight:800;
  letter-spacing:-.02em;
  line-height:1.35;
}
.sidebar h3{
  margin:25px 0 12px;
  font-size:.75rem;
  text-transform:uppercase;
  letter-spacing:.05em;
  opacity:.5;
  font-weight:700;
}
.sidebar div{
  padding:10px 14px;
  border-radius:8px;
  margin:2px 0;
  cursor:pointer;
  transition:.15s;
  font-size:14px;
  color:#cbd5e1;
}
.sidebar div:hover{background:rgba(255,255,255,.05);color:#fff;}
.sidebar div.active{background:rgba(255,255,255,.1);color:#fff;font-weight:600;}

/* ================= MAIN ================= */
.main{flex:1;padding:24px;overflow-y:auto;display:flex;flex-direction:column;}
.top{
  display:flex;
  flex-direction:column;
  gap:16px;
  margin-bottom:24px;
  position:sticky;
  top:0;
  background:var(--bg);
  z-index:10;
  padding-bottom:10px;
}
.modeSwitch{display:flex;gap:8px;align-items:center;}
.modeBtn{
  padding:8px 16px;
  border-radius:8px;
  border:1px solid var(--input-border);
  cursor:pointer;
  font-weight:600;
  background:var(--input-bg);
  color:var(--text);
  transition:.2s;
  font-size:14px;
}
.modeBtn.active{background:var(--text);color:var(--bg);border-color:var(--text);}
.themeToggle{
  margin-left:auto;
  font-size:18px;
  cursor:pointer;
  padding:8px;
  border-radius:8px;
  transition:.2s;
  display:flex;
  align-items:center;
  justify-content:center;
}
.themeToggle:hover{background:rgba(0,0,0,.05);}
body.dark .themeToggle:hover{background:rgba(255,255,255,.08);}

/* ================= SEARCH ================= */
.searchWrap{position:relative;}
.search{
  width:100%;
  padding:12px 72px 12px 16px;
  border-radius:10px;
  border:1px solid var(--input-border);
  background:var(--input-bg);
  color:var(--text);
  outline:none;
  font-size:15px;
  transition:.2s;
}
.search:focus{border-color:var(--focus-border);box-shadow:0 0 0 3px rgba(59,130,246,.1);}
.clearBtn{
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  width:24px;
  height:24px;
  background:transparent;
  border:none;
  border-radius:6px;
  color:var(--muted);
  cursor:pointer;
  font-size:18px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.clearBtn:hover{color:var(--danger);}
.kb-hint{
  position:absolute;
  right:45px;
  top:50%;
  transform:translateY(-50%);
  font-size:11px;
  background:rgba(0,0,0,.03);
  padding:2px 5px;
  border-radius:4px;
  color:var(--muted);
  pointer-events:none;
}
body.dark .kb-hint{background:rgba(255,255,255,.06);}

/* ================= CARDS ================= */
.card{
  background:var(--card);
  border-radius:12px;
  padding:24px;
  margin-bottom:20px;
  box-shadow:var(--shadow);
  border:1px solid var(--input-border);
  animation:fade .2s ease-out;
}
.title{font-weight:700;font-size:1rem;display:block;margin-bottom:12px;color:var(--text);}
.text{white-space:pre-line;line-height:1.6;font-size:15px;color:var(--text);unicode-bidi:plaintext;}
mark{background:var(--search-mark-bg);border-radius:2px;padding:0 1px;color:#111827;}
body.dark mark{color:#fef3c7;}
.slot{
  background:rgba(0,0,0,.04);
  border-radius:4px;
  padding:0 4px;
  font-weight:500;
  transition:.15s;
  color:var(--muted);
  direction:ltr;
  unicode-bidi:isolate;
  display:inline-block;
}
body.dark .slot{background:rgba(255,255,255,.06);}
.slot.active-focus{background:var(--focus-bg)!important;color:var(--focus-text)!important;box-shadow:0 0 0 1px var(--focus-border);}
.slot.filled{background:transparent;color:var(--text);font-weight:600;}
.vars-area{
  margin-top:20px;
  padding-top:18px;
  border-top:1px solid var(--input-border);
  display:flex;
  flex-wrap:wrap;
  gap:12px;
}
.var-input{
  padding:8px 12px;
  border-radius:8px;
  border:1px solid var(--input-border);
  font-size:13px;
  outline:none;
  transition:.2s;
  background:var(--input-bg);
  color:var(--text);
  min-width:140px;
}
.var-input:focus{border-color:var(--focus-border);background:var(--focus-bg);box-shadow:0 0 0 3px rgba(59,130,246,.1);}
.copyBtn{
  margin-top:20px;
  padding:10px 24px;
  border:none;
  border-radius:8px;
  background:var(--text);
  color:var(--bg);
  cursor:pointer;
  font-weight:600;
  transition:.2s;
  font-size:14px;
}
.copyBtn:hover{opacity:.9;transform:translateY(-1px);}
.copied{background:#10b981!important;color:#fff!important;}
.empty-state{text-align:center;padding:40px;opacity:.55;}
@keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

@media (max-width:760px){
  body{height:auto;min-height:100vh;display:block;overflow:auto;}
  .sidebar{width:100%;max-height:45vh;}
  .main{padding:16px;overflow:visible;}
}
</style>
</head>

<div class="sidebar">
  <h2>HR Talent Acquisition Tool</h2>

  <div id="content"></div>
</div>

/* ================= STATE ================= */
let mode = "replies";
let selectedCat = "";

/* ================= HELPERS ================= */
function escapeHtml(value){
  return String(value).replace(/[&<>"]/g, character => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"})[character]);
}
function escapeRegExp(value){return String(value).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");}
function escapeAttribute(value){return escapeHtml(value).replace(/'/g,"&#39;");}

function getVariables(text){
  const matches = text.match(/(?<!')(\([^)]+\))(?!')/g);
  return matches ? [...new Set(matches.map(match => match.slice(1,-1)))] : [];
}

function protectPlainBrackets(text){
  return text.replace(/'\(([^)]*)\)'/g,"\uE000$1\uE001");
}
function restorePlainBrackets(text){
  return text.replace(/\uE000(.*?)\uE001/g,"<bdi class=\"plain-bracket\" dir=\"ltr\">($1)</bdi>");
}
function highlightHtmlText(html, query){
  if(!query) return html;
  const matcher = new RegExp(`(${escapeRegExp(query)})`,"gi");
  return html.split(/(<[^>]*>)/g).map(part => part.startsWith("<") ? part : part.replace(matcher,"<mark>$1</mark>")).join("");
}
function renderMessage(originalText, values = {}){
  const vars = getVariables(originalText);
  let output = escapeHtml(protectPlainBrackets(originalText));
  vars.forEach(variable => {
    const replacement = values[variable]
      ? `<span class="slot filled" dir="ltr" data-var="${escapeAttribute(variable)}">${escapeHtml(values[variable])}</span>`
      : `<span class="slot" dir="ltr" data-var="${escapeAttribute(variable)}">(${escapeHtml(variable)})</span>`;
    output = output.replace(new RegExp(escapeRegExp(`(${variable})`),"g"),replacement);
  });
  return restorePlainBrackets(output);
}

function toggleTheme(){
  document.body.classList.toggle("dark");
  localStorage.setItem("hr-theme",document.body.classList.contains("dark") ? "dark" : "light");
}
if(localStorage.getItem("hr-theme") === "dark") document.body.classList.add("dark");

function clearSearch(){document.getElementById("search").value="";render();}
function setMode(nextMode){
  mode = nextMode;
  selectedCat = "";
  document.getElementById("repBtn").classList.toggle("active",mode === "replies");
  document.getElementById("msgBtn").classList.toggle("active",mode === "messages");
  document.getElementById("sideRep").classList.toggle("active",mode === "replies");
  document.getElementById("sideMsg").classList.toggle("active",mode === "messages");
  loadCats();
  render();
}
function setCategory(category){selectedCat = category;loadCats();render();}
function loadCats(){
  const categories = [...new Set(data.filter(item => item.main === mode).map(item => item.category))];
  const allItem = `<div class="${selectedCat === "" ? "active" : ""}" onclick="setCategory('')">All</div>`;
  const categoryItems = categories.map((category,index) => `<div class="${selectedCat === category ? "active" : ""}" data-category-index="${index}">${escapeHtml(category)}</div>`).join("");
  const cats = document.getElementById("cats");
  cats.innerHTML = allItem + categoryItems;
  [...cats.querySelectorAll("[data-category-index]")].forEach(item => {
    item.addEventListener("click",() => setCategory(categories[Number(item.dataset.categoryIndex)]));
  });
}

/* ================= MAGIC FILL ================= */
function focusSlot(dataIndex, variable, active){
  const card = document.querySelector(`.card[data-index="${dataIndex}"]`);
  if(!card) return;
  card.querySelectorAll(".slot[data-var]").forEach(slot => {
    if(slot.dataset.var === variable) slot.classList.toggle("active-focus",active);
  });
}
function updatePreview(dataIndex,input){
  const card = document.querySelector(`.card[data-index="${dataIndex}"]`);
  if(!card) return;
  const values = {};
  card.querySelectorAll(".var-input").forEach(field => {values[field.dataset.var] = field.value;});
  const query = document.getElementById("search").value.trim();
  card.querySelector(".text").innerHTML = highlightHtmlText(renderMessage(data[dataIndex].text,values),query);
  focusSlot(dataIndex,input.dataset.var,true);
}

/* ================= RENDER ================= */
function render(){
  const query = document.getElementById("search").value.trim();
  let list = data.map((item,index) => ({...item,dataIndex:index})).filter(item => item.main === mode);
  if(selectedCat) list = list.filter(item => item.category === selectedCat);
  if(query){
    const normalized = query.toLowerCase();
    list = list.filter(item => item.title.toLowerCase().includes(normalized) || item.text.toLowerCase().includes(normalized) || item.category.toLowerCase().includes(normalized));
  }
  const content = document.getElementById("content");
  content.innerHTML = list.length ? list.map(item => {
    const variables = getVariables(item.text);
    const title = highlightHtmlText(escapeHtml(item.title),query);
    const text = highlightHtmlText(renderMessage(item.text),query);
    const inputs = variables.length ? `<div class="vars-area">${variables.map(variable => `<input type="text" class="var-input" placeholder="${escapeAttribute(variable)}" data-var="${escapeAttribute(variable)}" onfocus="focusSlot(${item.dataIndex},this.dataset.var,true)" onblur="focusSlot(${item.dataIndex},this.dataset.var,false)" oninput="updatePreview(${item.dataIndex},this)">`).join("")}</div>` : "";
    return `<div class="card" data-index="${item.dataIndex}"><span class="title">${title}</span><div class="text">${text}</div>${inputs}<button class="copyBtn" onclick="copy(this)">Copy to Clipboard</button></div>`;
  }).join("") : `<div class="empty-state">No results found</div>`;
}

/* ================= COPY ================= */
async function copy(button){
  const text = button.parentElement.querySelector(".text").innerText;
  try{
    await navigator.clipboard.writeText(text);
  }catch(error){
    const area = document.createElement("textarea");
    area.value = text;
    document.body.appendChild(area);
    area.select();
    document.execCommand("copy");
    area.remove();
  }
  const original = button.innerText;
  button.innerText = "Copied ✓";
  button.classList.add("copied");
  setTimeout(() => {button.innerText = original;button.classList.remove("copied");},1500);
}

window.addEventListener("keydown",event => {
  if(event.key === "/" && document.activeElement.tagName !== "INPUT"){
    event.preventDefault();
    document.getElementById("search").focus();
  }
});

setMode("replies");
</script>
